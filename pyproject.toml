[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz_library"
version = "0.1.0"
description = "Make matplotlib plots look artsy with minimal effort."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["matplotlib>=3.5", "numpy"]

[tool.setuptools.packages.find]
include = ["viz_library*"]
